[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ecotrack"
version = "0.1.0"
description = "Multi-source satellite estimation of urban fossil-fuel CO2, Shivajinagar-Talegaon corridor"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
